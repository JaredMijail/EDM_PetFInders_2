project:
  type: website
  output-dir: _site
  # Solo se publican las páginas del sitio. El repositorio de referencia
  # (EDM_PetFInder/), las carpetas de trabajo y los intermedios de knitr
  # quedan fuera del render.
  render:
    - "*.qmd"
    - "entregas/*.qmd"
    - "proyecto/*.qmd"
    - "!EDM_PetFInder/**"
    - "!_borradores/**"

website:
  title: "EDM_segundaEntrega"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false
  search:
    location: navbar
    type: overlay
    limit: 30
    show-item-context: true
  navbar:
    pinned: true
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Entrega 02"
        menu:
          - text: "Análisis de correspondencias simple"
            href: entregas/analisis_correspondencias.qmd
      - text: "Acerca de"
        href: about.qmd
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: "Inicio"
        contents:
          - index.qmd
      - section: "Entrega 02"
        contents:
          - entregas/analisis_correspondencias.qmd
      - section: "Información"
        contents:
          - about.qmd
  page-footer:
    left: "EDM_segundaEntrega · Universidad Nacional de Colombia"
    center: "EDM — Estadística Descriptiva Multivariada"

lang: es

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "En esta página"
    number-sections: false
    code-fold: true
    code-summary: "Ver código"
    code-tools: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    citations-hover: true
    footnote-hover: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    fig-responsive: true
    fig-align: center
    lightbox: true
    grid:
      sidebar-width: 250px
      body-width: 960px
      margin-width: 280px
      gutter-width: 1.4rem
    include-in-header:
      - text: |
          <meta name="author" content="Jared Mijail Ramírez Escalante, María Paula Silva Capera">
          <meta name="keywords" content="PetFinder, adopción de mascotas, EDM, R, Quarto">

execute:
  freeze: auto
  warning: false
  message: false
  echo: true

editor: visual
